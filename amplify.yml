version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm -v
        - npm ci
        - cp src/assets/config/app.config.template.json src/assets/config/app.config.json
        - sed -i "s|#{API_URL}|$API_URL|g" src/assets/config/app.config.json
        - sed -i "s|#{COGNITO_USER_POOL_ID}|$COGNITO_USER_POOL_ID|g" src/assets/config/app.config.json
        - sed -i "s|#{COGNITO_CLIENT_ID}|$COGNITO_CLIENT_ID|g" src/assets/config/app.config.json
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/kitsoone-website/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
