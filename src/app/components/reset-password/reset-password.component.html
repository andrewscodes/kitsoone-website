<section class="reset-password">
  <h1 class="reset-password__title">Restablecer contraseña</h1>

  <p-toast></p-toast>

  @if (invalidLink()) {
    <p class="reset-password__description">
      Este enlace no es válido o ha expirado. Solicita un nuevo restablecimiento de contraseña.
    </p>

    <a routerLink="/forgot" class="default-button reset-password__submit">
      Solicitar nuevo enlace
    </a>
  } @else {
    <p class="reset-password__description">Ingresa tu nueva contraseña.</p>

    <form #resetForm="ngForm" (ngSubmit)="onSubmit(resetForm)" class="reset-password__form">
      <p-floatlabel variant="in">
        <p-password
          id="newPassword"
          [(ngModel)]="newPassword"
          name="newPassword"
          [toggleMask]="true"
          [maxlength]="128"
          autocomplete="new-password"
          styleClass="reset-password__password">
        </p-password>
        <label for="newPassword" required>Nueva contraseña</label>
      </p-floatlabel>

      <p-floatlabel variant="in">
        <p-password
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          [feedback]="false"
          [toggleMask]="true"
          [maxlength]="128"
          autocomplete="new-password"
          styleClass="reset-password__password">
        </p-password>
        <label for="confirmPassword" required>Confirmar contraseña</label>
      </p-floatlabel>

      <button
        type="submit"
        class="default-button reset-password__submit"
        [disabled]="submitting()">
        Restablecer contraseña
      </button>
    </form>
  }

  <div class="reset-password__links">
    <a routerLink="/login" class="reset-password__link">Volver a iniciar sesión</a>
  </div>
</section>
